# SPDX-License-Identifier: MPL-2.0
#
# cargo-about configuration for the Rust crate notices bundled with the
# Android app (libdropumi_ffi.so). Used by scripts/android/rust-notices.sh.
# The accepted list mirrors deny.toml's [licenses] allow list.
accepted = [
  "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "BlueOak-1.0.0",
  "BSL-1.0", "CC0-1.0", "ISC", "MIT", "MPL-2.0", "Unicode-3.0", "Zlib",
]
# The two Android ABIs the app ships.
targets = ["aarch64-linux-android", "x86_64-linux-android"]
# Only what is linked into the library.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# The workspace's own crates are MPL-2.0 (LICENSE) and not third-party.
private = { ignore = true }
