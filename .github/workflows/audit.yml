# SPDX-License-Identifier: MPL-2.0
#
# Daily RustSec advisory scan of Cargo.lock, so new advisories surface even when
# no pull request is open. Never a required check.
name: Audit
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  advisories:
    name: scheduled advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with: { tool: cargo-deny@0.20.2, fallback: none }
      - run: cargo deny --locked check advisories
