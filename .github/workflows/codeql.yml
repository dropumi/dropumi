# SPDX-License-Identifier: MPL-2.0
#
# CodeQL advanced setup (versioned, SHA-pinned, stable job names). Do not also
# enable CodeQL default setup in the repository settings; the two conflict.
# The analyze job is the only job in this repository that escalates permissions
# (security-events: write, needed to upload SARIF results).
name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository
      security-events: write # upload CodeQL SARIF results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [actions, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
