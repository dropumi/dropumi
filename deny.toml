# SPDX-License-Identifier: MPL-2.0
#
# cargo-deny policy (ADR-0010). Checked in CI by the "cargo-deny (advisories)" and
# "cargo-deny (bans licenses sources)" jobs, and daily by "scheduled advisories".
# Requires cargo-deny >= 0.20.0 ([bans.std-replacements]); CI pins 0.20.2.
[graph]
targets = [
  "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin", "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc",
  "aarch64-linux-android", "x86_64-linux-android",
  "aarch64-apple-ios", "aarch64-apple-ios-sim",
]
all-features = true

[output]
feature-depth = 1

[advisories]
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
ignore = []

[licenses]
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "BlueOak-1.0.0",
         "BSL-1.0", "CC0-1.0", "ISC", "MIT", "MPL-2.0", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.93
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [
  { crate = "openssl", reason = "pure-Rust crypto only (ADR-0002, ADR-0010)" },
  { crate = "openssl-sys", reason = "pure-Rust crypto only (ADR-0002, ADR-0010)" },
  { crate = "native-tls", reason = "pure-Rust crypto only (ADR-0002, ADR-0010)" },
  { crate = "ring", reason = "snow built without ring (ADR-0002); remove only via the CP1 fallback" },
]

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = true
unused = "deny"

[bans.std-replacements]
scope = "workspace"
level = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
