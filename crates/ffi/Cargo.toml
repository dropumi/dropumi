[package]
name = "dropumi-ffi"
description = "Dropumi foreign-function interface for the native apps (UniFFI bindings to the Rust core)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[lints]
workspace = true

[dependencies]
dropumi-application.workspace = true
dropumi-domain.workspace = true
dropumi-infra.workspace = true
dropumi-protocol.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
uniffi.workspace = true

[dev-dependencies]
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time", "test-util"] }
