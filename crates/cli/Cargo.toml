# SPDX-License-Identifier: MPL-2.0
[package]
name = "dropumi-cli"
description = "Dropumi command-line interface (binary: dropumi)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "dropumi"
path = "src/main.rs"

[features]
default = ["mdns"]
mdns = ["dropumi-infra/mdns"]

[dependencies]
clap.workspace = true
dropumi-application.workspace = true
dropumi-domain.workspace = true
dropumi-infra.workspace = true
dropumi-protocol.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "signal", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
# Discards pending terminal input before each prompt (tcflush).
rustix = { workspace = true, features = ["termios"] }

[dev-dependencies]
proptest.workspace = true
sha2.workspace = true
tempfile.workspace = true
