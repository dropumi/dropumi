# SPDX-License-Identifier: MPL-2.0
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/dropumi/dropumi"
publish = false

# Internal crates. External dependencies are added in the commit that first
# uses them (cargo-deny rejects unused workspace dependencies).
[workspace.dependencies]
dropumi-domain = { path = "crates/domain" }
dropumi-protocol = { path = "crates/protocol" }
dropumi-application = { path = "crates/application" }
dropumi-infra = { path = "crates/infra", default-features = false }

blake3 = "1.8.7"
data-encoding = "2.11.1"
getrandom = "0.3.4"
minicbor = { version = "2.3.0", default-features = false, features = ["alloc"] }
proptest = "1.12.0"
sha2 = "0.10.9"
snow = { version = "0.10.0", default-features = false, features = ["use-curve25519", "use-chacha20poly1305", "use-sha2", "use-getrandom"] }
thiserror = "2.0.21"
unicode-normalization = "0.1.25"
zeroize = "1.9.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mem_forget = "deny"
print_stdout = "warn"
print_stderr = "warn"
exit = "warn"
cast_possible_truncation = "warn"

[profile.dev]
debug = "line-tables-only"

# Keep crypto and hashing fast in debug test builds; workspace crates stay debug.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
# panic stays "unwind": temp-file cleanup relies on Drop.
strip = "symbols"
